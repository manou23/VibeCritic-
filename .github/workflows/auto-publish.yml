name: Generate reviews and publish
# Review content is versioned independently; existing reviews follow reviewVersion: 2.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */8 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'src/content/reviews/**'
      - 'data/processed.json'
      - 'src/data/trending.json'
permissions:
  contents: write
concurrency:
  group: vibecritic-content-generation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      # OpenRouter is supported as an AI generation provider.
      - name: Generate reviews
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_PER_RUN: '3'
          GAMES_WINDOW_DAYS: '90'
        run: |
          echo "TMDB_API_KEY configured: $([ -n "$TMDB_API_KEY" ] && echo yes || echo no)"
          echo "IGDB_CLIENT_ID configured: $([ -n "$IGDB_CLIENT_ID" ] && echo yes || echo no)"
          echo "IGDB_CLIENT_SECRET configured: $([ -n "$IGDB_CLIENT_SECRET" ] && echo yes || echo no)"
          echo "OPENAI_API_KEY configured: $([ -n "$OPENAI_API_KEY" ] && echo yes || echo no)"
          echo "GEMINI_API_KEY configured: $([ -n "$GEMINI_API_KEY" ] && echo yes || echo no)"
          echo "OPENROUTER_API_KEY configured: $([ -n "$OPENROUTER_API_KEY" ] && echo yes || echo no)"
          if [ -n "$TMDB_API_KEY" ] && [ -n "$IGDB_CLIENT_ID" ] && [ -n "$IGDB_CLIENT_SECRET" ] && { [ -n "$OPENAI_API_KEY" ] || [ -n "$GEMINI_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ]; }; then
            npm run generate
          else
            echo "API secrets are not fully configured; skipping generation and continuing the site build."
          fi
      - name: Commit generated reviews
        run: |
          if [[ -n "$(git status --porcelain src/content/reviews data/processed.json src/data/trending.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/reviews data/processed.json src/data/trending.json
            git commit -m "chore: update generated reviews"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push generated content after 3 attempts."
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi
      - name: Build site
        run: npm run build
