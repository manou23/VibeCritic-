name: Generate reviews and publish
# Re-run the existing-review video backfill after YouTube secret setup.
# Review content is versioned independently; existing reviews follow reviewVersion: 2.
on:
  workflow_dispatch:
  schedule:
    # One article per run, every 12 hours: 03:17 and 15:17 Algeria time (UTC+1).
    - cron: '17 2,14 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/content/reviews/**'
      - '!src/data/trending.json'
      - 'functions/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - '.github/workflows/auto-publish.yml'
permissions:
  contents: write
concurrency:
  group: vibecritic-content-generation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main before generation
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check scripts/generate-reviews.mjs
          node --check scripts/backfill-arabic-titles.mjs
          node --check scripts/backfill-game-platforms.mjs
          node --check functions/api/review.js
      - name: Install dependencies
        run: npm install
      - name: Validate review score integrity
        run: npm run validate:reviews
      # OpenRouter is supported as an AI generation provider.
      - name: Test Cloudflare Workers AI connectivity
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[test-workers-ai]')
        env:
          CF_WORKERS_AI_API_TOKEN: ${{ secrets.CF_WORKERS_AI_API_TOKEN }}
          CF_WORKERS_AI_MODEL: ${{ vars.CF_WORKERS_AI_MODEL }}
          CF_AI_GATEWAY_ACCOUNT_ID: ${{ vars.CF_AI_GATEWAY_ACCOUNT_ID }}
          CF_AI_GATEWAY_ID: ${{ vars.CF_AI_GATEWAY_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CF_WORKERS_AI_API_TOKEN;
          const account = process.env.CF_AI_GATEWAY_ACCOUNT_ID;
          const gateway = process.env.CF_AI_GATEWAY_ID;
          if (!token || !account || !gateway) throw new Error('Workers AI token or Gateway configuration is missing.');
          const model = process.env.CF_WORKERS_AI_MODEL || '@cf/openai/gpt-oss-20b';
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/ai/v1/chat/completions`, {
            method: 'POST',
            headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', 'cf-aig-gateway-id': gateway },
            body: JSON.stringify({ model, max_tokens: 512, reasoning_effort: 'low', messages: [{ role: 'user', content: 'Reply with exactly: VibeCritic Workers AI connection OK' }] }),
            signal: AbortSignal.timeout(90000)
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Workers AI HTTP ${response.status}: ${body.slice(0, 700)}`);
          const data = JSON.parse(body);
          // Accept either the direct OpenAI-compatible payload or a Cloudflare API result envelope.
          const payload = data.result && typeof data.result === 'object' ? data.result : data;
          const message = payload.choices?.[0]?.message;
          let content = message?.content;
          if (Array.isArray(content)) content = content.map(part => part?.text || '').join('');
          if (typeof content !== 'string' || !content.trim()) {
            const diagnostic = {
              topLevelKeys: Object.keys(data),
              payloadKeys: Object.keys(payload),
              success: data.success,
              errors: Array.isArray(data.errors) ? data.errors.map(error => ({ code: error.code, message: error.message })) : undefined,
              choicesCount: Array.isArray(payload.choices) ? payload.choices.length : 0,
              firstChoiceKeys: payload.choices?.[0] ? Object.keys(payload.choices[0]) : [],
              finishReason: payload.choices?.[0]?.finish_reason
            };
            console.error('Workers AI response shape (no credentials included):', JSON.stringify(diagnostic));
            throw new Error('Workers AI returned HTTP success but no usable chat completion content.');
          }
          console.log('Workers AI connectivity test passed. Model:', model);
          console.log('Response received; token value was not logged.');
          NODE
      - name: Generate reviews
        # Run for scheduled/manual events, and for an intentional generation-trigger commit only.
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[generate-reviews]')
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_WORKERS_AI_API_TOKEN: ${{ secrets.CF_WORKERS_AI_API_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CF_WORKERS_AI_MODEL: ${{ vars.CF_WORKERS_AI_MODEL }}
          CF_AI_GATEWAY_ACCOUNT_ID: ${{ vars.CF_AI_GATEWAY_ACCOUNT_ID }}
          CF_AI_GATEWAY_ID: ${{ vars.CF_AI_GATEWAY_ID }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GAMES_WINDOW_DAYS: ${{ vars.GAMES_WINDOW_DAYS || '14' }}
          UPCOMING_WINDOW_DAYS: ${{ vars.UPCOMING_WINDOW_DAYS || '365' }}
        run: |
          echo "TMDB_API_KEY configured: $([ -n "$TMDB_API_KEY" ] && echo yes || echo no)"
          echo "IGDB_CLIENT_ID configured: $([ -n "$IGDB_CLIENT_ID" ] && echo yes || echo no)"
          echo "IGDB_CLIENT_SECRET configured: $([ -n "$IGDB_CLIENT_SECRET" ] && echo yes || echo no)"
          echo "RAWG_API_KEY configured: $([ -n "$RAWG_API_KEY" ] && echo yes || echo no)"
          echo "OPENAI_API_KEY configured: $([ -n "$OPENAI_API_KEY" ] && echo yes || echo no)"
          echo "GEMINI_API_KEY configured: $([ -n "$GEMINI_API_KEY" ] && echo yes || echo no)"
          echo "GROQ_API_KEY configured: $([ -n "$GROQ_API_KEY" ] && echo yes || echo no)"
          echo "OPENROUTER_API_KEY configured: $([ -n "$OPENROUTER_API_KEY" ] && echo yes || echo no)"
          echo "CF_WORKERS_AI_API_TOKEN configured: $([ -n "$CF_WORKERS_AI_API_TOKEN" ] && echo yes || echo no)"
          echo "YOUTUBE_API_KEY configured: $([ -n "$YOUTUBE_API_KEY" ] && echo yes || echo no)"
          if [ -n "$TMDB_API_KEY" ] && { [ -n "$RAWG_API_KEY" ] || { [ -n "$IGDB_CLIENT_ID" ] && [ -n "$IGDB_CLIENT_SECRET" ]; }; } && { [ -n "$OPENAI_API_KEY" ] || [ -n "$GEMINI_API_KEY" ] || [ -n "$GROQ_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ] || [ -n "$CF_WORKERS_AI_API_TOKEN" ]; }; then
            npm run generate
          else
            echo "API secrets are not fully configured; skipping generation and continuing the site build."
          fi
      - name: Validate generated review scores and quality metadata
        run: npm run validate:reviews
      - name: Add videos to previously published reviews
        if: github.event_name == 'workflow_dispatch'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run backfill:videos
      - name: Localize existing movie and series titles from TMDb
        if: github.event_name == 'workflow_dispatch'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run backfill:titles
      - name: Backfill RAWG platforms and stores for existing games
        if: github.event_name == 'workflow_dispatch'
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: npm run backfill:games
      - name: Commit generated reviews and learning memory
        if: always()
        run: |
          if [[ -n "$(git status --porcelain src/content/reviews data/processed.json src/data/trending.json data/learning-memory.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/reviews data/processed.json src/data/trending.json data/learning-memory.json
            git commit -m "chore: update generated reviews"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push generated content after 3 attempts."
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi
      - name: Build production site
        run: CF_PAGES=1 npm run build
      - name: Validate production build, SEO and sitemap
        run: npm run validate:build
