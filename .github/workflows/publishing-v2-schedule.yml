name: VibeCritic Publishing V2 Schedule
on:
  workflow_dispatch:
  schedule:
    # Restore the previously proven scheduler; avoid quarter-hour/hour-boundary load.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: vibecritic-publisher-v2-schedule-main
  cancel-in-progress: false
jobs:
  publish-cycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run V2 tests
        run: npm run test:publishing-v2
      - name: Run one bounded publishing cycle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_FREE_TIER_ONLY: ${{ vars.CLOUDFLARE_FREE_TIER_ONLY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: node scripts/publishing-v2/run-cycle.mjs
      - name: Build and validate generated content
        if: success()
        env:
          CF_PAGES: '1'
        run: |
          if git status --porcelain -- src/content/reviews | grep -q .; then
            npm run validate:reviews
            npm run build
            npm run validate:build
          else
            echo "No review article changed; skipping the full site build for this checkpoint."
          fi
      - name: Commit durable queue and any newly written article
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publisher-v2-state.json src/content/reviews
          if git diff --cached --quiet; then
            echo "No durable state or article changes to commit."
          else
            git commit -m "chore(publisher-v2): checkpoint editorial cycle"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another main-branch update (attempt $attempt/5); retrying safely."
              sleep 2
            done
            echo "Could not checkpoint after five safe rebase/push attempts."
            exit 1
          fi
