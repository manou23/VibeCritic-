name: Publishing Engine v2 reliability tests
on:
  push:
    branches: [main, publisher-v2-rebuild, publisher-v2-five-hour-completion]
    paths: ['scripts/publishing-v2/**', 'scripts/test-publishing-v2.mjs', 'scripts/test-publishing-v2-runner.mjs', 'scripts/test-publishing-v2-adapters.mjs', '.github/workflows/publishing-v2-tests.yml']
  pull_request:
    paths: ['scripts/publishing-v2/**', 'scripts/test-publishing-v2.mjs', 'scripts/test-publishing-v2-runner.mjs', '.github/workflows/publishing-v2-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/publishing-v2/core.mjs
      - run: node --check scripts/test-publishing-v2.mjs
      - run: node --check scripts/test-publishing-v2-runner.mjs
      - run: node --check scripts/publishing-v2/store.mjs
      - run: node --check scripts/publishing-v2/runner.mjs
      - run: node --check scripts/publishing-v2/adapters.mjs
      - run: node --check scripts/publishing-v2/run-cycle.mjs
      - run: node --check scripts/test-publishing-v2-adapters.mjs
      - run: npm run test:publishing-v2
