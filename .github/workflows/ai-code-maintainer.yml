name: AI code maintainer

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

# Shared with auto-publish.yml to prevent overlapping jobs.
concurrency:
  group: vibecritic-content-generation
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate maintainer script
        run: python -m py_compile .github/scripts/ai_code_maintainer.py

      - name: Review and propose safe source-code fixes with Groq
        id: ai
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: python .github/scripts/ai_code_maintainer.py

      - name: Set up Node
        if: steps.ai.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        if: steps.ai.outputs.changed == 'true'
        run: npm install --no-package-lock

      - name: Build and validate the production site
        if: steps.ai.outputs.changed == 'true'
        env:
          CF_PAGES: '1'
        run: |
          npm run build
          npm run validate:build

      - name: Check patch formatting
        if: steps.ai.outputs.changed == 'true'
        run: git diff --check

      - name: Commit verified improvements
        if: steps.ai.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components src/layouts src/pages src/styles src/consts.ts src/content.config.ts
          if git diff --cached --quiet; then
            echo "No staged source changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore: apply verified AI code maintenance"
          git push origin HEAD:main
