name: VibeCritic Publishing V2
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: vibecritic-publisher-v2
  cancel-in-progress: false
jobs:
  publish-cycle:
    if: github.ref == 'refs/heads/publisher-v2-rebuild' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run V2 tests
        run: npm run test:publishing-v2
      - name: Run one bounded publishing cycle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: node scripts/publishing-v2/run-cycle.mjs
      - name: Build and validate generated content
        run: |
          npm run validate:reviews
          npm run build
          npm run validate:build
      - name: Commit durable queue and any newly written article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publisher-v2-state.json src/content/reviews
          if git diff --cached --quiet; then
            echo "No durable state or article changes to commit."
          else
            git commit -m "chore(publisher-v2): checkpoint editorial cycle"
            git push origin HEAD:${{ github.ref_name }}
          fi
