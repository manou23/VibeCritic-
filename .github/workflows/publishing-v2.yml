name: VibeCritic Publishing V2
on:
  workflow_dispatch:
  # Content edits must pass score/schema/build checks and deploy through this pipeline.
  push:
    branches: [main, publisher-v2-rebuild]
    paths: ['.github/workflows/publishing-v2.yml', 'src/content/reviews/**', 'docs/PUBLISHING-ENGINE-V2.md', 'scripts/publishing-v2/core.mjs', 'scripts/publishing-v2/store.mjs', 'scripts/publishing-v2/runner.mjs', 'scripts/publishing-v2/run-cycle.mjs', 'scripts/publishing-v2/adapters.mjs', 'scripts/test-publishing-v2-adapters.mjs']
  schedule:
    # Poll every 15 minutes; run-cycle.mjs enforces one publishing cycle per five hours.
    # Pushes to this workflow also provide an immediate recovery/verification run.
    # The durable cycle guard reserves 3 hours for work and 2 hours for rest without holding a runner asleep.
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  # Isolate main from the stale queued runs in the previous shared group.
  group: vibecritic-publisher-v2-main-recovery
  cancel-in-progress: false
jobs:
  publish-cycle:
    if: github.ref == 'refs/heads/publisher-v2-rebuild' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run V2 tests
        run: npm run test:publishing-v2
      - name: Run one bounded publishing cycle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_FREE_TIER_ONLY: ${{ vars.CLOUDFLARE_FREE_TIER_ONLY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: node scripts/publishing-v2/run-cycle.mjs
      - name: Build and validate generated content
        env:
          CF_PAGES: '1'
        run: |
          npm run validate:reviews
          npm run build
          npm run validate:build
      - name: Commit durable queue and any newly written article
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publisher-v2-state.json src/content/reviews
          if git diff --cached --quiet; then
            echo "No durable state or article changes to commit."
          else
            git commit -m "chore(publisher-v2): checkpoint editorial cycle"
            for attempt in 1 2 3 4 5; do
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }}
              if git push origin HEAD:${{ github.ref_name }}; then
                exit 0
              fi
              echo "Push raced with another main-branch update (attempt $attempt/5); retrying safely."
              sleep 2
            done
            echo "Could not checkpoint after five safe rebase/push attempts."
            exit 1
          fi
