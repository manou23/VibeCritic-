name: VibeCritic Publishing V2 Heartbeat

# Automatic scheduling is centralized in publishing-v2-automatic.yml.
# Keep this workflow as a manual recovery entry point only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vibecritic-publisher-v2-main
  cancel-in-progress: false

jobs:
  publish-cycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run V2 tests
        run: npm run test:publishing-v2
      - name: Run one bounded publishing cycle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_FREE_TIER_ONLY: ${{ vars.CLOUDFLARE_FREE_TIER_ONLY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: node scripts/publishing-v2/run-cycle.mjs
      - name: Build and validate generated content
        if: success()
        env:
          CF_PAGES: '1'
        run: |
          if git status --porcelain -- src/content/reviews | grep -q .; then
            npm run validate:reviews
            npm run build
            npm run validate:build
          else
            echo "No article was written in this recovery cycle."
          fi
      - name: Commit durable queue and any newly written article
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publisher-v2-state.json src/content/reviews
          if git diff --cached --quiet; then
            echo "No durable state or article changes to commit."
            exit 0
          fi
          git commit -m "chore(publisher-v2): checkpoint editorial cycle"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
