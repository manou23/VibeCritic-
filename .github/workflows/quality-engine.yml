name: VibeCritic Quality Engine

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibecritic-quality-engine
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Run report-only quality scan
        run: node scripts/quality-engine/run.mjs
      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: vibecritic-quality-report-${{ github.run_id }}
          path: quality-engine-report/
          if-no-files-found: error
          retention-days: 14
