name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic validation tests
        run: |
          npm run test:provider-cooldown
          npm run test:review-json
          npm run test:review-validation
          npm run test:knowledge-graph
          npm run test:editorial-reasoning
          npm run test:knowledge-retrieval
          npm run test:reasoning-quality
          npm run test:rawg-backfill
          npm run test:scoring-rubric
          npm run validate:reviews

      - name: Build production site
        run: CF_PAGES=1 npm run build

      - name: Validate production build, SEO and sitemap
        run: npm run validate:build
