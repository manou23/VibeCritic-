name: Apply VibeCritic editorial reference library

on:
  push:
    branches: [main]
    paths:
      - 'migrations/0004_editorial_reference_library.sql'
      - 'migrations/0005_editorial_craft_references.sql'
      - 'migrations/0006_editorial_reference_batch.sql'
      - '.github/workflows/apply-editorial-library.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibecritic-editorial-library-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Apply idempotent editorial library migration to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx --yes wrangler@4 d1 execute entertainment-db --remote --file=migrations/0004_editorial_reference_library.sql
          npx --yes wrangler@4 d1 execute entertainment-db --remote --file=migrations/0005_editorial_craft_references.sql
          npx --yes wrangler@4 d1 execute entertainment-db --remote --file=migrations/0006_editorial_reference_batch.sql
