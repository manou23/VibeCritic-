name: Review quality and build checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [quality/score-integrity-and-gates, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibecritic-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install dependencies
        run: npm install
      - name: Report dependency security advisories
        run: npm audit --audit-level=low
      - name: Check JavaScript syntax
        run: |
          node --check scripts/generate-reviews.mjs
          node --check scripts/knowledge-graph.mjs
          node --check scripts/source-evidence.mjs
          node --check scripts/editorial-reasoning.mjs
          node --check scripts/test-editorial-reasoning.mjs
          node --check scripts/test-knowledge-graph.mjs
          npm run test:knowledge-graph
          npm run test:source-evidence
          node --check scripts/knowledge-gaps.mjs
          node --check scripts/test-knowledge-gaps.mjs
          npm run test:knowledge-gaps
          node --check scripts/specialist-skills.mjs
          node --check scripts/test-specialist-skills.mjs
          npm run test:specialist-skills
          node --check scripts/critical-questions.mjs
          node --check scripts/test-critical-questions.mjs
          npm run test:critical-questions
          node --check scripts/intellectual-repetition.mjs
          node --check scripts/test-intellectual-repetition.mjs
          npm run test:intellectual-repetition
          node --check scripts/memory-maintenance.mjs
          node --check scripts/test-memory-maintenance.mjs
          npm run test:memory-maintenance
          node --check scripts/personality-evolution.mjs
          node --check scripts/test-personality-evolution.mjs
          npm run test:personality-evolution
          node --check scripts/historical-comparisons.mjs
          node --check scripts/test-historical-comparisons.mjs
          npm run test:historical-comparisons
          npm run test:editorial-reasoning
          node --check scripts/backfill-arabic-titles.mjs
          node --check scripts/backfill-game-platforms.mjs
          node --check scripts/validate-review-scores.mjs
          node --check functions/api/review.js
      - name: Validate review scores
        run: npm run validate:reviews
      - name: Build production site
        run: CF_PAGES=1 npm run build
      - name: Validate build and sitemap
        run: npm run validate:build
