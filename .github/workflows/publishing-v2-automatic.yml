name: VibeCritic Automatic Publishing V2

on:
  # The only automatic publisher. It prepares drafts into content-queue and moves one verified-ready article live on each durable 45-minute slot; five-minute checks recover due work.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publishing-v2-automatic.yml'
      - 'scripts/publishing-v2/**'
      - 'data/publisher-v2-settings.json'

permissions:
  contents: write

concurrency:
  group: vibecritic-publisher-v2-main
  cancel-in-progress: false

jobs:
  publish-cycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run publisher reliability tests
        run: npm run test:publishing-v2

      - name: Run one bounded automatic publishing cycle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Explicitly restrict Workers AI routing to the free-tier provider path.
          CLOUDFLARE_FREE_TIER_ONLY: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: node scripts/publishing-v2/run-cycle.mjs

      - name: Validate and build when an article was written
        if: success()
        env:
          CF_PAGES: '1'
        run: |
          if git status --porcelain -- src/content/reviews | grep -q .; then
            npm run validate:reviews
            npm run build
            npm run validate:build
          else
            echo "No article was written in this cycle. The saved queue will resume on the next scheduled run."
          fi

      - name: Commit durable queue and any newly written article
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p content-queue
          git add data/publisher-v2-state.json content-queue src/content/reviews
          if git diff --cached --quiet; then
            echo "No durable state or article changes to commit."
            exit 0
          fi
          git commit -m "chore(publisher-v2): checkpoint editorial cycle"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; retrying safe push ($attempt/5)."
            sleep 3
          done
          echo "Could not checkpoint after five safe rebase/push attempts."
          exit 1
